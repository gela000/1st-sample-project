<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // 🔧 REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Redirect if already logged in
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'admin.html';
    });

    window.doLogin = async () => {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;
      const btn   = document.getElementById('login-btn');
      const err   = document.getElementById('error-msg');

      err.textContent = '';
      btn.textContent = 'Signing in…';
      btn.disabled = true;

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        window.location.href = 'admin.html';
      } catch (e) {
        const messages = {
          'auth/user-not-found':     'No account found with this email.',
          'auth/wrong-password':     'Incorrect password. Try again.',
          'auth/invalid-email':      'Please enter a valid email.',
          'auth/too-many-requests':  'Too many attempts. Please wait.',
          'auth/invalid-credential': 'Invalid email or password.',
        };
        err.textContent = messages[e.code] || 'Login failed. Check your credentials.';
        btn.textContent = 'Sign In';
        btn.disabled = false;
        document.getElementById('login-box').classList.add('shake');
        setTimeout(()=>document.getElementById('login-box').classList.remove('shake'), 600);
      }
    };

    window.handleKeydown = e => { if(e.key === 'Enter') window.doLogin(); };
  </script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0b0c0e; --surface: #131417; --border: #1e2026;
      --accent: #c9f564; --text: #e8e8e4; --muted: #6b6e78; --card: #161820;
      --error: #ff5f5f;
    }
    body {
      background:var(--bg); color:var(--text);
      font-family:'DM Sans',sans-serif; font-weight:300;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      cursor:none; overflow:hidden;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events:none; z-index:0; opacity:.4;
    }
    .bg-glow {
      position:fixed; border-radius:50%; pointer-events:none;
      width:800px; height:800px;
      background:radial-gradient(circle,rgba(201,245,100,.04) 0%,transparent 65%);
      top:50%; left:50%; transform:translate(-50%,-50%);
    }

    #cursor { width:8px; height:8px; background:var(--accent); border-radius:50%; position:fixed; top:0; left:0; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:transform .15s; }
    #cursor-ring { width:28px; height:28px; border:1px solid rgba(201,245,100,.35); border-radius:50%; position:fixed; top:0; left:0; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); transition:transform .35s ease, width .3s, height .3s; }

    .login-wrap { position:relative; z-index:1; width:100%; max-width:440px; padding:1rem; }
    .login-back { display:inline-flex; align-items:center; gap:.5rem; color:var(--muted); font-size:.78rem; text-decoration:none; letter-spacing:.05em; text-transform:uppercase; margin-bottom:2.5rem; transition:color .25s; }
    .login-back:hover { color:var(--text); }

    #login-box {
      background:var(--card); border:1px solid var(--border); border-radius:6px;
      padding:3rem; animation:fadeIn .6s ease both;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%,60%{transform:translateX(-8px)}
      40%,80%{transform:translateX(8px)}
    }
    #login-box.shake { animation:shake .5s ease; }

    .login-logo { font-family:'Playfair Display',serif; font-size:1.6rem; letter-spacing:-.02em; margin-bottom:.4rem; }
    .login-logo span { color:var(--accent); }
    .login-subtitle { color:var(--muted); font-size:.85rem; margin-bottom:2.5rem; }

    .field { margin-bottom:1.4rem; }
    .field label { display:block; font-size:.76rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:.55rem; }
    .field input {
      width:100%; background:var(--surface); border:1px solid var(--border);
      color:var(--text); padding:.85rem 1rem; border-radius:3px;
      font-family:'DM Sans',sans-serif; font-size:.92rem; font-weight:300;
      outline:none; transition:border-color .25s;
    }
    .field input:focus { border-color:rgba(201,245,100,.5); }
    .field input::placeholder { color:var(--muted); }

    .error-msg { min-height:1.2rem; color:var(--error); font-size:.82rem; margin-bottom:1.2rem; text-align:center; letter-spacing:.02em; }

    #login-btn {
      width:100%; background:var(--accent); color:#0b0c0e;
      border:none; padding:1rem; font-family:'DM Sans',sans-serif;
      font-size:.9rem; font-weight:500; cursor:none; border-radius:3px;
      letter-spacing:.04em; text-transform:uppercase;
      transition:background .25s, transform .2s, box-shadow .25s;
    }
    #login-btn:hover:not(:disabled) { background:#d8ff6e; transform:translateY(-1px); box-shadow:0 8px 24px rgba(201,245,100,.2); }
    #login-btn:disabled { opacity:.6; }

    .login-footer { text-align:center; margin-top:1.8rem; font-size:.78rem; color:var(--muted); }
    .login-footer a { color:var(--accent); text-decoration:none; }

    @media(max-width:480px) { #login-box { padding:2rem 1.5rem; } }
  </style>
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>
  <div class="bg-glow"></div>

  <div class="login-wrap">
    <a href="index.html" class="login-back">← Back to Portfolio</a>
    <div id="login-box">
      <div class="login-logo">Port<span>folio</span></div>
      <p class="login-subtitle">Sign in to access your admin panel</p>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="admin@example.com" onkeydown="handleKeydown(event)" autocomplete="email"/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" onkeydown="handleKeydown(event)" autocomplete="current-password"/>
      </div>

      <div class="error-msg" id="error-msg"></div>
      <button id="login-btn" onclick="doLogin()">Sign In</button>

      <div class="login-footer">
        Protected admin area · <a href="index.html">View Portfolio →</a>
      </div>
    </div>
  </div>

  <script>
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
    function animateCursor(){
      cursor.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`;
      rx+=(mx-rx)*.12;ry+=(my-ry)*.12;
      ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
    document.querySelectorAll('input,button,a').forEach(el=>{
      el.addEventListener('mouseenter',()=>{ring.style.width='44px';ring.style.height='44px';ring.style.borderColor='rgba(201,245,100,.5)';});
      el.addEventListener('mouseleave',()=>{ring.style.width='28px';ring.style.height='28px';ring.style.borderColor='rgba(201,245,100,.35)';});
    });
  </script>
</body>
</html>
